name: Build & Release Windows .exe

# ── Triggers ──────────────────────────────────────────────────────────────────
# Manual run from the Actions tab, or auto-run on every push to main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. v0.2.0) — leave blank to use the one in tauri.conf.json'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'artifacts/echopulse/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    name: Build & publish Windows installer
    runs-on: windows-latest

    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      # ── Source ──────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node / pnpm ──────────────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Setup Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'artifacts/echopulse/src-tauri -> target'

      # ── Dependencies ──────────────────────────────────────────────────────────
      - name: Install Node dependencies
        run: pnpm install

      # ── Icons (orange theme) ─────────────────────────────────────────────────
      - name: Generate source icon (512×512 orange PNG)
        shell: python
        run: |
          import struct, zlib, os
          def make_png(size, r, g, b):
              def chunk(name, data):
                  crc = zlib.crc32(name + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + name + data + struct.pack('>I', crc)
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              row = bytes([0]) + bytes([r, g, b] * size)
              idat = zlib.compress(row * size)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', idat) + chunk(b'IEND', b'')
          out = 'artifacts/echopulse/app-icon.png'
          with open(out, 'wb') as f:
              f.write(make_png(512, 255, 102, 0))   # #FF6600 orange
          print(f'Written {os.path.getsize(out)} bytes → {out}')

      - name: Generate all Tauri icon sizes
        working-directory: artifacts/echopulse
        run: pnpm tauri icon app-icon.png

      # ── Build (signed) ────────────────────────────────────────────────────────
      - name: Build Tauri app (NSIS installer + updater artifacts)
        working-directory: artifacts/echopulse
        run: pnpm tauri build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Updater signing key — add TAURI_SIGNING_PRIVATE_KEY as a repo secret.
          # Value: the full content of the generated private key file (base64 string).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Determine version ─────────────────────────────────────────────────────
      - name: Read version from tauri.conf.json
        id: ver
        shell: python
        run: |
          import json, os
          with open('artifacts/echopulse/src-tauri/tauri.conf.json') as f:
              v = json.load(f)['version']
          tag = os.environ.get('INPUT_VERSION') or f'v{v}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag={tag}\n')
              out.write(f'semver={v}\n')
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      # ── Build latest.json update manifest ─────────────────────────────────────
      - name: Generate latest.json update manifest
        id: manifest
        shell: python
        run: |
          import json, os, glob, datetime

          bundle_dir = 'artifacts/echopulse/src-tauri/target/release/bundle/nsis'
          tag        = os.environ['TAG']
          repo       = os.environ['GITHUB_REPOSITORY']
          base_url   = f'https://github.com/{repo}/releases/download/{tag}'

          # Find the generated .nsis.zip and its .sig
          zips = glob.glob(f'{bundle_dir}/*.nsis.zip')
          if not zips:
              raise FileNotFoundError(f'No .nsis.zip found in {bundle_dir}')
          zip_path = zips[0]
          sig_path = zip_path + '.sig'

          zip_name = os.path.basename(zip_path)
          with open(sig_path) as f:
              signature = f.read().strip()

          manifest = {
              'version': os.environ['SEMVER'],
              'notes':   f'david {tag}',
              'pub_date': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'),
              'platforms': {
                  'windows-x86_64': {
                      'signature': signature,
                      'url': f'{base_url}/{zip_name}',
                  }
              }
          }

          out_path = f'{bundle_dir}/latest.json'
          with open(out_path, 'w') as f:
              json.dump(manifest, f, indent=2)
          print(f'Wrote {out_path}')
          print(json.dumps(manifest, indent=2))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
              o.write(f'bundle_dir={bundle_dir}\n')
              o.write(f'zip_name={zip_name}\n')
        env:
          TAG:    ${{ steps.ver.outputs.tag }}
          SEMVER: ${{ steps.ver.outputs.semver }}

      # ── Create / update GitHub Release ────────────────────────────────────────
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name:     david ${{ steps.ver.outputs.tag }}
          body: |
            ## david ${{ steps.ver.outputs.tag }}

            ### Install
            Download **`david_${{ steps.ver.outputs.semver }}_x64-setup.exe`** and run it.
            No admin rights required — installs for the current user only.

            ### Update
            If you already have david installed it will update itself silently
            in the background next time it launches.

            ### First-time setup
            1. david starts in the system tray (bottom-right)
            2. Click the tray icon to open the window
            3. Click ⚙ and paste your Gemini API key
            4. Optionally set your favourite playlist URL
            5. Say **"david"** to wake it
          make_latest: true
          files: |
            ${{ steps.manifest.outputs.bundle_dir }}/*.exe
            ${{ steps.manifest.outputs.bundle_dir }}/*.nsis.zip
            ${{ steps.manifest.outputs.bundle_dir }}/*.nsis.zip.sig
            ${{ steps.manifest.outputs.bundle_dir }}/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
