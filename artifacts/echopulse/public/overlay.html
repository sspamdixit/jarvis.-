<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>david overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 220px;
      height: 56px;
      overflow: hidden;
      background: #0d0d0d;
      font-family: 'Courier New', 'Consolas', monospace;
    }

    .frame {
      position: fixed;
      inset: 0;
      border: 2px solid #FF6600;
      pointer-events: none;
      box-shadow: inset 0 0 18px #FF660022;
    }

    .inner {
      display: flex;
      align-items: center;
      height: 56px;
      padding: 0 14px;
      gap: 10px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #FF6600;
      box-shadow: 0 0 10px #FF6600, 0 0 4px #FF6600;
      flex-shrink: 0;
      animation: pulse 0.9s ease-in-out infinite;
    }

    .label {
      color: #FF6600;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .bar {
      flex: 1;
      height: 2px;
      background: linear-gradient(to right, #FF6600, transparent);
      border-radius: 1px;
      animation: barPulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }

    @keyframes barPulse {
      0%, 100% { opacity: 0.9; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="frame"></div>
  <div class="inner">
    <div class="dot"></div>
    <span class="label">david</span>
    <div class="bar"></div>
  </div>
</body>
</html>
